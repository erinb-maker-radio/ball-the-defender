    <!-- Volume Control -->
    <script>
        class VolumeControl {
            constructor() {
                this.volume = 85; // 0-100 percentage
                this.isMuted = false;
                this.savedVolume = 85; // Volume before muting
                this.storageKey = 'ballDefender_volume';
                this.init();
            }

            init() {
                // Restore persisted volume
                this.loadPersistedState();

                const volumeSlider = document.getElementById('volumeSlider');
                const volumeIcon = document.getElementById('volumeIcon');

                if (volumeSlider) {
                    // Slider change handler
                    volumeSlider.addEventListener('input', (e) => {
                        this.setVolume(parseInt(e.target.value));
                    });
                }

                if (volumeIcon) {
                    // Click icon to toggle mute
                    volumeIcon.addEventListener('click', () => {
                        this.toggleMute();
                    });
                }

                // Keyboard shortcut: "m" to mute/unmute
                document.addEventListener('keydown', (e) => {
                    if (e.key.toLowerCase() === 'm' && !e.ctrlKey && !e.altKey && !e.shiftKey) {
                        // Don't trigger if typing in an input
                        if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
                            e.preventDefault();
                            this.toggleMute();
                        }
                    }
                });

                // Initial render and apply volume
                this.updateUI();
                setTimeout(() => this.applyVolume(), 1000);
            }

            loadPersistedState() {
                const persisted = localStorage.getItem(this.storageKey);
                if (persisted !== null) {
                    const data = JSON.parse(persisted);
                    this.volume = data.volume ?? 85;
                    this.isMuted = data.muted ?? false;
                    this.savedVolume = data.savedVolume ?? this.volume;
                }
            }

            saveState() {
                localStorage.setItem(this.storageKey, JSON.stringify({
                    volume: this.volume,
                    muted: this.isMuted,
                    savedVolume: this.savedVolume
                }));
            }

            setVolume(value, persist = true) {
                this.volume = Math.max(0, Math.min(100, value));

                // If setting volume above 0, unmute
                if (this.volume > 0 && this.isMuted) {
                    this.isMuted = false;
                }

                // If setting volume to 0, consider it muted
                if (this.volume === 0) {
                    this.isMuted = true;
                }

                this.applyVolume();
                this.updateUI();

                if (persist) {
                    this.saveState();
                }
            }

            toggleMute() {
                if (this.isMuted) {
                    // Unmute - restore saved volume
                    this.isMuted = false;
                    this.volume = this.savedVolume || 85;
                } else {
                    // Mute - save current volume first
                    this.savedVolume = this.volume > 0 ? this.volume : 85;
                    this.isMuted = true;
                    this.volume = 0;
                }

                this.applyVolume();
                this.updateUI();
                this.saveState();
            }

            applyVolume() {
                if (window.audioEngine && window.audioEngine.masterGain) {
                    const actualVolume = this.isMuted ? 0 : (this.volume / 100);
                    const now = window.audioEngine.audioContext.currentTime;
                    window.audioEngine.masterGain.gain.setTargetAtTime(actualVolume, now, 0.01);
                }
            }

            updateUI() {
                const volumeSlider = document.getElementById('volumeSlider');
                const volumeIcon = document.getElementById('volumeIcon');

                if (volumeSlider) {
                    volumeSlider.value = this.volume;
                }

                if (volumeIcon) {
                    if (this.isMuted || this.volume === 0) {
                        volumeIcon.textContent = '🔇';
                        volumeIcon.title = 'Unmute (m)';
                    } else if (this.volume < 50) {
                        volumeIcon.textContent = '🔉';
                        volumeIcon.title = 'Mute (m)';
                    } else {
                        volumeIcon.textContent = '🔊';
                        volumeIcon.title = 'Mute (m)';
                    }
                }
            }
        }

        // Creative Digital Time Display System
        function initializeTimeDisplays() {
            function updateDigitalTime(containerId, totalSeconds, isGlobal = false) {
                const container = document.getElementById(containerId);
                if (!container) return;

                const days = Math.floor(totalSeconds / 86400);
                const hours = Math.floor((totalSeconds % 86400) / 3600);
                const minutes = Math.floor((totalSeconds % 3600) / 60);

                // Update day digits
                const dayDigits = container.querySelectorAll('.day-digit');
                const dayStr = String(days).padStart(3, '0');
                dayDigits.forEach((digit, index) => {
                    digit.textContent = dayStr[index] || '0';
                });

                // Update hour digits
                const hourDigits = container.querySelectorAll('.hour-digit');
                const hourStr = String(hours).padStart(2, '0');
                hourDigits.forEach((digit, index) => {
                    digit.textContent = hourStr[index] || '0';
                });

                // Update minute digits
                const minuteDigits = container.querySelectorAll('.minute-digit');
                const minuteStr = String(minutes).padStart(2, '0');
                minuteDigits.forEach((digit, index) => {
                    digit.textContent = minuteStr[index] || '0';
                });

            }
            
            function updateTimeDisplays() {
                if (window.GlobalTimeTracker) {
                    const localSeconds = Math.floor(window.GlobalTimeTracker.getCurrentSessionTime() / 1000);
                    const globalSeconds = Math.floor(window.GlobalTimeTracker.getGlobalTime() / 1000);

                    updateDigitalTime('localTimeDigits', localSeconds, false);
                    updateDigitalTime('globalTimeDigits', globalSeconds, true);
                } else {
                    // Fallback: try to load global time directly from Supabase
                    loadGlobalTimeDirectly();
                }
            }

            // Direct Supabase fetch for global time (fallback)
            let lastGlobalFetch = 0;
            async function loadGlobalTimeDirectly() {
                const now = Date.now();
                if (now - lastGlobalFetch < 30000) return; // Only fetch every 30 seconds
                lastGlobalFetch = now;

                try {
                    const response = await fetch('https://bxhcbyypjfzpuxhftppv.supabase.co/rest/v1/ball_defender_global_stats', {
                        headers: {
                            'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4aGNieXlwamZ6cHV4aGZ0cHB2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU4OTM4MTIsImV4cCI6MjA3MTQ2OTgxMn0.cOakT3KAfQiegW9YuAoS6pXXeo9u5C-xpriWVqLPpGs'
                        }
                    });
                    if (response.ok) {
                        const data = await response.json();
                        if (data[0] && data[0].total_time_played_ms) {
                            const globalSeconds = Math.floor(data[0].total_time_played_ms / 1000);
                            updateDigitalTime('globalTimeDigits', globalSeconds, true);
                        }
                    }
                } catch (e) {
                    console.warn('Could not load global time:', e);
                }
            }
            
            // Update every second
            setInterval(updateTimeDisplays, 1000);
            updateTimeDisplays(); // Initial update

            // Load global time immediately on page load
            loadGlobalTimeDirectly();
        }

        // Blocks Destroyed Counter System
        function initializeBlocksDestroyedCounter() {
            window.blocksDestroyedCount = 0;
            
            // Hook into the game to track when blocks are destroyed
            function trackBlockDestruction() {
                if (!window.blocks) return;
                
                // Check for destroyed blocks and increment counter
                window.blocks.forEach(block => {
                    if (block.destroyed && !block.countedAsDestroyed) {
                        window.blocksDestroyedCount++;
                        block.countedAsDestroyed = true; // Mark as counted to avoid double counting
                        updateBlocksDestroyedDisplay();
                    }
                });
            }
            
            function updateBlocksDestroyedDisplay() {
                const display = document.getElementById('blocksDestroyed');
                if (display) {
                    display.textContent = window.blocksDestroyedCount;
                }
            }
            
            // Reset counter when game starts
            function resetBlocksDestroyedCounter() {
                window.blocksDestroyedCount = 0;
                updateBlocksDestroyedDisplay();
            }
            
            // Monitor for game state changes
            setInterval(() => {
                if (window.gameState === 'playing') {
                    trackBlockDestruction();
                } else if (window.gameState === 'stopped' || window.gameState === 'menu') {
                    // Reset counter when game ends or returns to menu
                    if (window.blocksDestroyedCount > 0) {
                        resetBlocksDestroyedCounter();
                    }
                }
            }, 100); // Check frequently for responsive updates
            
            // Expose reset function globally so game can call it
            window.resetBlocksDestroyedCounter = resetBlocksDestroyedCounter;
            
            console.log('✅ Blocks destroyed counter initialized');
        }
    </script>

    <!-- Service Worker Registration -->
    <script>
        // Force clear old service worker caches on load
        if ('serviceWorker' in navigator) {
            // First, clear all caches
            caches.keys().then(function(names) {
                for (let name of names) {
                    console.log('🗑️ Clearing cache:', name);
                    caches.delete(name);
                }
            });

            // Then register fresh service worker
            navigator.serviceWorker.register('sw.js').then(function(registration) {
                console.log('SW registered: ', registration);
                // Force update check
                registration.update();
            }).catch(function(registrationError) {
                console.log('SW registration failed: ', registrationError);
            });
        }
    </script>

        }

        .loading-text {
            position: absolute;
            bottom: calc(3% + 10px);

        .sculpt-popup {

            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);

        .sculpt-header h2 {
            color: #667eea;

        .close-btn {

        .sculpt-sections {

        .sculpt-section {

            border-radius: 10px;
            padding: 12px;
        }

        .sculpt-section h3 {
            color: #64ffda;
            font-size: 0.9rem;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sculpt-control {
            display: flex;
            flex-direction: column;

            margin-bottom: 10px;
        }

        .sculpt-control:last-child {

        .sculpt-control label {

            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
        }

        .sculpt-control input[type="range"] {
            width: 100%;
            height: 6px;
            background: rgba(102, 126, 234, 0.2);
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;

        .sculpt-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;

            background: #667eea;

            transition: transform 0.1s;
        }

        .sculpt-control input[type="range"]::-webkit-slider-thumb:hover {

        }

        .value-display {
            color: #667eea;
            font-size: 0.7rem;
            text-align: right;
        }

        #soundSculptBtn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        #soundSculptBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.5);
        }

        @media (max-width: 500px) {
            .sculpt-sections {
                grid-template-columns: 1fr;
            }
        }

        /* Geo Tracking Styles */
        .geo-stats-panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 8px 10px;
            margin-top: 10px;
            border: 1px solid rgba(102, 126, 234, 0.2);
        }

        .geo-stats-header {
            color: #64ffda;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
        }

        .geo-stats-header:hover {
            color: #9efff0;
        }

        .geo-toggle {
            margin-left: auto;
            font-size: 0.7rem;
            transition: transform 0.2s ease;
        }

        .geo-stats-panel:not(.collapsed) .geo-toggle {
            transform: rotate(90deg);
        }

        .geo-content {
            overflow: hidden;
            max-height: 300px;
            transition: max-height 0.3s ease, margin-top 0.3s ease, opacity 0.2s ease;
            margin-top: 8px;

        }

        .geo-stats-panel.collapsed .geo-content {
            max-height: 0;

        }

        .geo-icon {

        .geo-loading {
            color: #666;
            font-size: 0.75rem;
            font-style: italic;
        }

        .geo-stat-item {

            border-radius: 6px;
            padding: 8px;
            margin-bottom: 6px;
        }

        .geo-stat-item.farthest {
            border-left: 3px solid #ff6b6b;
        }

        .geo-stat-label {
            color: #888;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .geo-stat-value {
            color: #fff;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .geo-stat-detail {
            color: #667eea;
            font-size: 0.7rem;
            margin-top: 2px;
        }

        .geo-locations-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 6px;
        }

        .geo-location-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 6px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 4px;
            font-size: 0.7rem;
        }

        .geo-location-name {
            color: #ccc;
        }

        .geo-location-distance {
            color: #667eea;
            font-weight: 500;
        }

        .geo-summary {
            color: #666;
            font-size: 0.65rem;
            text-align: center;
            margin-top: 8px;
            padding-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>

    <!-- Audio Editor Popup (iframe-based full sequencer) -->
    <div id="soundSculptPopup" class="audio-editor-popup" style="display: none;" onclick="if(event.target===this) closeAudioEditor();">
        <div class="audio-editor-container">
            <div class="audio-editor-header">
                <span>🎛️ Audio Sequencer</span>
                <div class="audio-editor-controls">
                    <button onclick="closeAudioEditor();" class="editor-close-btn">✕ Close</button>
                </div>
            </div>
            <iframe id="audioEditorFrame" src="audio-editor.html" frameborder="0"></iframe>
        </div>
    </div>

    <style>
        .audio-editor-popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .audio-editor-container {
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            border-radius: 0;
            overflow: hidden;
            box-shadow: none;
            border: none;
            display: flex;
            flex-direction: column;
        }

        .audio-editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .audio-editor-controls {
            display: flex;
            gap: 10px;
        }

        .editor-close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .editor-close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        #audioEditorFrame {
            flex: 1;
            width: 100%;
            border: none;
        }
    </style>

    <script>
        // Audio Editor Bridge - connects game to iframe sequencer
        const AudioEditorBridge = {
            iframe: null,
            isPlaying: false,

            init() {
                this.iframe = document.getElementById('audioEditorFrame');
                // Listen for messages from the audio editor
                window.addEventListener('message', (e) => {
                    if (e.data.type === 'audioEditorReady') {
                        console.log('🎛️ Audio Editor ready');
                    }
                    if (e.data.type === 'audioEditorPlaying') {
                        this.isPlaying = e.data.playing;
                    }
                });
            },

            sendCommand(command, data = {}) {
                if (this.iframe && this.iframe.contentWindow) {
                    this.iframe.contentWindow.postMessage({ type: command, ...data }, '*');
                }
            },

            play() {
                this.sendCommand('play');
                this.isPlaying = true;
            },

            stop() {
                this.sendCommand('stop');
                this.isPlaying = false;
            },

            pause() {
                this.sendCommand('pause');
            },

            resume() {
                this.sendCommand('resume');
            },

            setMode(mode) {
                this.sendCommand('setMode', { mode });
            }
        };

        // Initialize bridge when DOM ready
        document.addEventListener('DOMContentLoaded', () => {
            AudioEditorBridge.init();
        });

        // Audio editor playback is now started from game.js after loading screen is hidden
        // This ensures music doesn't start during loading

        // Hook into game stop
        window.addEventListener('load', () => {
            const checkStopGame = setInterval(() => {
                if (window.stopGame) {
                    const gameStopGame = window.stopGame;
                    window.stopGame = function(...args) {
                        AudioEditorBridge.stop();
                        return gameStopGame.apply(this, args);
                    };
                    clearInterval(checkStopGame);
                }
            }, 100);
        });

        function openAudioEditor() {
            document.getElementById('soundSculptPopup').style.display = 'flex';

            // Send current game mode to audio editor
            const currentMode = window.currentGameMode?.id || window.selectedGameMode || localStorage.getItem('ballDefender_selectedMode') || 'original';
            const iframe = document.getElementById('audioEditorFrame');
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage({ type: 'setMode', mode: currentMode }, '*');
                console.log('🎛️ Audio editor opened with mode:', currentMode);
            }
        }

        function closeAudioEditor() {
            document.getElementById('soundSculptPopup').style.display = 'none';
        }
    </script>
